# Local development stack: PostgreSQL + API (serves the frontend at http://localhost:8000).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qgenai
      POSTGRES_USER: qgenai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}   # dev-only default; set POSTGRES_PASSWORD in .env
    ports: ["127.0.0.1:5432:5432"]   # reachable from this machine only
    restart: unless-stopped
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qgenai -d qgenai"]
      interval: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: docker/Dockerfile }
    depends_on:
      db: { condition: service_healthy }
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://qgenai:${POSTGRES_PASSWORD:-change-me}@db:5432/qgenai
      STORAGE_PATH: /app/data/raw/images
      SEED_SAMPLE_DATA: "true"
      CORS_ORIGINS: http://localhost:8000
      LOG_FORMAT: ${LOG_FORMAT:-console}
      # Demo defaults (override in .env): deterministic analysis, GenAI RCA with the MOCK provider (no key needed),
      # SOP grounding over the DEMO / SYNTHETIC knowledge base (index built by the entrypoint).
      PIPELINE_ANALYSIS_ENGINE: ${PIPELINE_ANALYSIS_ENGINE:-deterministic}
      RCA_ENGINE: ${RCA_ENGINE:-genai}
      ACTION_ENGINE: ${ACTION_ENGINE:-rca}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      RAG_ENABLED: ${RAG_ENABLED:-true}
    ports: ["8000:8000"]
    restart: unless-stopped
    volumes: [images:/app/data/raw/images]

volumes:
  pgdata:
  images:
