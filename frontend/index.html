<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q-GenAI Inspection</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Q-GenAI <span>Dark-store inspection</span></h1>
    <p class="note">Part 1 foundation: AI modules are not implemented yet. Inspections are routed to operator review; no predictions are shown.</p>
  </header>

  <main>
    <form id="inspection-form" novalidate>
      <h2>New inspection</h2>
      <label>Store <select name="store_id" required></select></label>
      <label>SKU <select name="sku_id" required></select></label>
      <label>Fulfillment stage <select name="stage" required></select></label>
      <label>Order ID <span class="opt">(optional)</span> <input name="order_id" placeholder="ORD-100245" maxlength="64"></label>
      <label>Operator ID <span class="opt">(optional)</span> <input name="operator_id" placeholder="OP-17" maxlength="64"></label>
      <label>Product image <input type="file" name="image" accept="image/jpeg,image/png,image/webp" required></label>
      <img id="preview" alt="" hidden>
      <button type="submit">Submit inspection</button>
      <div id="error" class="error" role="alert" hidden></div>
    </form>

    <section id="result" hidden aria-live="polite">
      <h2>Inspection</h2>
      <dl>
        <dt>Inspection ID</dt><dd id="r-id" class="mono"></dd>
        <dt>Pipeline status</dt><dd><span id="r-status" class="badge"></span></dd>
        <dt>Decision</dt><dd id="r-decision"></dd>
        <dt>Reason</dt><dd id="r-reason"></dd>
      </dl>
      <h3>Pipeline stages</h3>
      <ol id="r-stages"></ol>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
