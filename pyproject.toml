[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "q-genai"
version = "0.1.0"
description = "Computer-vision-first quality intelligence pipeline for quick-commerce dark stores"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "numpy>=1.26",          # image quality gate, CV postprocessing
    "pyyaml>=6.0",          # defect taxonomy / dataset definitions
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
# Real CV engine (CV_ENGINE=yolov8), training and evaluation. Pulls PyTorch.
# CPU-only machines can install the smaller CPU wheel first:
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
# NOTE: Ultralytics is AGPL-3.0 licensed (see README "Licensing").
cv = [
    "ultralytics==8.4.190",
]
# Optional ONNX export (python -m ml.cv.export)
cv-export = [
    "onnx>=1.16",
]

[tool.setuptools.packages.find]
include = ["backend*", "ml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.package-data]
"ml.cv" = ["taxonomy.yaml"]
