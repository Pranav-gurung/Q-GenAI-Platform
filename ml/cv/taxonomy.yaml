# Q-GenAI dark-store defect taxonomy: the single source of truth for CV class ids and names.
#
# id / name         : model class index and name (dataset.yaml `names` is generated from this list)
# defect_type       : platform DefectType (backend/domain/enums.py) the class maps to
# base_severity     : starting point of the deterministic severity mapping (ml/cv/severity.py)
# safety_critical   : food-safety / tamper risk -> severity is never below HIGH
# data_status       : synthetic_demo = generated by ml/cv/synthetic.py, trainable for DEMO purposes only
#                     placeholder    = no dataset yet; a model trained today has never seen this class
#                     (there is no "real" class yet: no real-world dataset has been collected)
# min_confidence    : optional per-class override of CV_CONFIDENCE_THRESHOLD
version: 1
classes:
  - {id: 0, name: crushed_packaging, defect_type: CRUSHED_PACKAGE,  base_severity: MEDIUM, safety_critical: false, data_status: placeholder,
     description: "Package visibly deformed / flattened"}
  - {id: 1, name: torn_packaging,    defect_type: TORN_PACKAGE,     base_severity: MEDIUM, safety_critical: false, data_status: synthetic_demo,
     description: "Tear or rip in packet / pouch / wrapper"}
  - {id: 2, name: leakage,           defect_type: LEAKING_PACKAGE,  base_severity: HIGH,   safety_critical: true,  data_status: synthetic_demo,
     description: "Liquid leaking from or pooled around a product"}
  - {id: 3, name: broken_seal,       defect_type: BROKEN_SEAL,      base_severity: HIGH,   safety_critical: true,  data_status: placeholder,
     description: "Tamper / freshness seal broken"}
  - {id: 4, name: opened_package,    defect_type: OPENED_PACKAGE,   base_severity: HIGH,   safety_critical: true,  data_status: placeholder,
     description: "Package opened"}
  - {id: 5, name: dented_container,  defect_type: DENTED_CONTAINER, base_severity: MEDIUM, safety_critical: false, data_status: synthetic_demo,
     description: "Dent in can / tin / rigid container"}
  - {id: 6, name: damaged_box,       defect_type: DAMAGED_BOX,      base_severity: LOW,    safety_critical: false, data_status: synthetic_demo,
     description: "Crushed corner / crease / damage on a carton"}
  - {id: 7, name: missing_label,     defect_type: MISSING_LABEL,    base_severity: MEDIUM, safety_critical: false, data_status: synthetic_demo,
     description: "Product without its label (box covers the product)"}
  - {id: 8, name: wrong_item,        defect_type: INCORRECT_ITEM,   base_severity: HIGH,   safety_critical: false, data_status: placeholder,
     description: "Item does not match the ordered SKU (needs SKU reference images; not a pure defect detector task)"}
  - {id: 9, name: visual_anomaly,    defect_type: VISUAL_ANOMALY,   base_severity: LOW,    safety_critical: false, data_status: placeholder,
     description: "Anything visually abnormal not covered above"}
